name: Candidate CI example

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Build image
        run: docker build -t export-service:${{ github.sha }} .
