# Configuración de Alembic (migraciones de la base de datos).
# La URL de conexión no se escribe aquí: env.py la toma de la configuración
# validada de la aplicación (variables POSTGRES_*).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
